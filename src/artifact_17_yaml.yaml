version: "3.8"

services:
  sentinel-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solpulse_sentinel_worker
    restart: unless-stopped
    environment:
      - PROGRAM_ID=Sent1neL11111111111111111111111111111111111
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WSS_URL=wss://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ACCOUNTING_EMAIL=${ACCOUNTING_EMAIL:-treasury@enterprise.com}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"