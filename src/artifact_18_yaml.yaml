version: "3.8"

services:
  aegis-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-sentinel-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=Aegis11111111111111111111111111111111111111
      - GUARDIAN_KEYPAIR_PATH=/secrets/guardian-keypair.json
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ALERT_EMAIL=secops@aegisvault.fi
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./keys:/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"