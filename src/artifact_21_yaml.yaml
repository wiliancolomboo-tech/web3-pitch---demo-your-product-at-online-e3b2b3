version: '3.8'

services:
  vanguard-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanguard_sentinel_relay
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - VANGUARD_PROGRAM_ID=Vangurd111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - EXECUTIVE_EMAIL_RECIPIENT=treasury@enterprise-dao.org
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s